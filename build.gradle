plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
	// Mod Menu（模组列表 + 设置按钮）
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

loom {
	// main = 服务端+通用代码，client = 只在客户端运行的代码（界面、按键、渲染）
	splitEnvironmentSourceSets()

	mods {
		"memorypalace" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Markdown 解析。include = 打包进模组 jar 里（玩家不用另外装）
	for (String lib : ["commonmark", "commonmark-ext-gfm-tables", "commonmark-ext-gfm-strikethrough", "commonmark-ext-task-list-items"]) {
		implementation "org.commonmark:${lib}:${project.commonmark_version}"
		include "org.commonmark:${lib}:${project.commonmark_version}"
	}

	// LaTeX 公式 → 图片（纯 Java，用 java.awt 画图）
	implementation "org.scilab.forge:jlatexmath:${project.jlatexmath_version}"
	include "org.scilab.forge:jlatexmath:${project.jlatexmath_version}"

	// 密码 → 密钥（Argon2id，纯 Java，约 90KB）
	implementation "com.password4j:password4j:${project.password4j_version}"
	include "com.password4j:password4j:${project.password4j_version}"

	// 权限：服务器上装了 LuckPerms 等权限模组时按它的设置，没装时退回到原版 OP 等级（约 12KB，打包进模组）
	implementation "me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"
	include "me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"

	// 历史版本按行存差异（Myers 算法，和 git diff 同一种；Apache 2.0，无依赖，约 70KB）
	implementation "io.github.java-diff-utils:java-diff-utils:${project.java_diff_utils_version}"
	include "io.github.java-diff-utils:java-diff-utils:${project.java_diff_utils_version}"

	// 服务端配置文件 config/memorypalace-server.toml（带注释、默认值、校验；NeoForge 的配置系统也用它）
	for (String lib : ["core", "toml"]) {
		implementation "com.electronwill.night-config:${lib}:${project.night_config_version}"
		include "com.electronwill.night-config:${lib}:${project.night_config_version}"
	}

	// Mod Menu 是可选的：编译时用它的接口，开发版游戏里也装上方便测试，但不打包进模组
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// 单元测试（只测 core/ 里不依赖游戏的代码）
	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// 笔记解密小工具：不开游戏，用密码或恢复密钥把加密笔记解成明文另存一份。
// 单独一个可以双击运行的 jar（build/libs/memory-palace-decrypt-<版本>.jar），只带 core/ 和密码库，不需要 Minecraft
configurations {
	decryptToolLibs
}

dependencies {
	decryptToolLibs "com.password4j:password4j:${project.password4j_version}"
}

tasks.register("decryptTool", Jar) {
	group = "build"
	archiveBaseName = "memory-palace-decrypt"
	manifest {
		attributes "Main-Class": "com.memorypalace.tool.DecryptTool"
	}
	from(sourceSets.main.output) {
		include "com/memorypalace/core/**", "com/memorypalace/tool/**"
	}
	from({ configurations.decryptToolLibs.collect { zipTree(it) } }) {
		exclude "META-INF/MANIFEST.MF", "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA", "module-info.class", "META-INF/versions/**/module-info.class"
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

assemble.dependsOn "decryptTool"
